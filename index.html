<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Violingo 🎻</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2fbf71">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Violingo">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="bg-emoji bg-violin">🎻</div>
  <div class="bg-emoji bg-note1">🎵</div>
  <div class="bg-emoji bg-note2">🎶</div>
  <div class="bg-emoji bg-score">🎼</div>
  <div class="bg-emoji bg-note3">🎵</div>
  <div class="bg-emoji bg-note4">🎶</div>
</div>

<div id="main-screen" class="screen">
  <header class="topbar">
    <div class="owl-wrap small"><div class="owl" id="owl-main"></div></div>
    <div class="topbar-text">
      <h1>Violingo</h1>
      <p id="countdown" class="countdown"></p>
    </div>
  </header>

  <section class="days-section">
    <div id="days-path" class="days-path"></div>
  </section>

  <section class="last-prize-box">
    <div class="last-prize-icon" id="last-prize-icon">🎁</div>
    <div class="last-prize-text">
      <div class="last-prize-title">Your last prize</div>
      <div id="last-prize-value">Practice to win your first prize!</div>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
